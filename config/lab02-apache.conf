# Apache VirtualHost configuration for Lab 02 - VaultTech Financial Services Portal

# (Main Apache config already listens on port 80 by default)

# Intentional Misconfiguration: Server version disclosed in headers (A05)
ServerTokens Full
ServerSignature On

<VirtualHost *:80>
    ServerName vaulttech.local
    DocumentRoot /srv/labs/lab02/public

    # Public web root access
    <Directory /srv/labs/lab02/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Intentional Misconfiguration: Directory listing ENABLED on /backup/
    # (Security Misconfiguration vulnerability — A05:2021)
    <Directory /srv/labs/lab02/public/backup>
        Options +Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Intentional Misconfiguration: Directory listing ENABLED on /api/
    # (Vulnerable Components endpoint discovery — A06:2021)
    <Directory /srv/labs/lab02/public/api>
        Options +Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Defense-in-Depth: Explicitly deny web access to data/ directory
    <Directory /srv/labs/lab02/data>
        Require all denied
    </Directory>

    # Pass all PHP scripts to dedicated lab02 PHP-FPM pool socket
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/lab02.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog /var/log/httpd/lab02_error.log
    CustomLog /var/log/httpd/lab02_access.log combined
</VirtualHost>
