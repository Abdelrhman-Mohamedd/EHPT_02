; /etc/php-fpm.d/lab02.conf
[lab02]
user = lab02
group = lab02
listen = /run/php-fpm/lab02.sock
listen.owner = apache
listen.group = lab02
listen.mode = 0660

; Process Manager Configuration
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Directory & Security Boundaries
php_admin_value[open_basedir] = /srv/labs/lab02:/etc/lab_jwt_flag:/etc/lab_vulncomp_flag:/tmp
php_admin_value[session.save_path] = /srv/labs/lab02/sessions

; Lab 02 Deliberate Misconfigurations
; Cryptographic Failures: display_errors leaks stack traces with sensitive data
php_flag[display_errors] = On
php_flag[display_startup_errors] = On

; Security Misconfiguration: expose_php = On leaks PHP version in headers
php_admin_value[expose_php] = On

; Allow file reads for the vulnerable component simulation
php_admin_value[allow_url_fopen] = On
php_admin_value[allow_url_include] = Off

; No disabled functions — needed for exec() in the vulnerable component endpoint
php_admin_value[disable_functions] =

; Resource Limits
php_admin_value[max_execution_time] = 30
php_admin_value[memory_limit] = 128M
